<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css">
    <title>Frolik</title>
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <h1><a href="#">Frolik</a></h1>
        </div>

        <ul class="nav-centre">
            <li><a href="#">Home</a></li>
            <li><a href="#">Games</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Support</a></li>
        </ul>

        <div class="nav-right">
            <div class="search-bar">
                <input type="text" placeholder="Search games...">
            </div>
            <div class="user-profile">
                <a href="#"><img src="images/prof.png" alt="User Profile"></a>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Frolik</h1>
            <h2>Discover Your Next Favorite Game</h2>
            <p>Explore a vast collection of games across various genres and platforms.</p>
        </div>
    </header>
    <section class="games-scroll">
        <h2>Featured Games</h2>
        <div class="cards-container">
            <div class="game-card">
                <img src="Images/cover1.jpg" alt="Game Cover">
            </div>
                        <div class="game-card">
                <img src="Images/cover2.jpg" alt="Game Cover">
            </div>
                        <div class="game-card">
                <img src="Images/cover3.jpg" alt="Game Cover">
            </div>
                        <div class="game-card">
                <img src="Images/cover4.jpg" alt="Game Cover">
            </div>
                        <div class="game-card">
                <img src="Images/cover5.jpg" alt="Game Cover">
            </div>
        </div>

    </section>

</body>

</html>
