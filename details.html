<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css">
    <title>Frolik</title>
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <h1><a href="#">Frolik</a></h1>
        </div>

        <ul class="nav-centre">
            <li><a href="#">Home</a></li>
            <li><a href="#">Games</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Support</a></li>
        </ul>

        <div class="nav-right">
            <div class="search-bar">
                <input type="text" placeholder="Search games...">
            </div>
            <div class="user-profile">
                <a href="#"><img src="images/prof.png" alt="User Profile"></a>
            </div>
        </div>
    </nav>
    <header class="detail-hero">
        <div class="detail-content">
            <h2>Discover Your Next Favorite Game</h2>
        </div>
    </header>
    <section class="games-scroll" id="detail-scroll">
        <div class="big-card">
            <img src="Images/poster2.jpg" alt="Featured Game">
        </div>
        <div class="cards-container" id="detail-container">
            <div class="game-card" id="detail-card">
                <img src="Images/cover1.jpg" alt="Game Cover">
            </div>
                        <div class="game-card">
                <img src="Images/cover2.jpg" alt="Game Cover">
            </div>
                        <div class="game-card">
                <img src="Images/cover3.jpg" alt="Game Cover">
            </div>
                        <div class="game-card">
                <img src="Images/cover4.jpg" alt="Game Cover">
            </div>
                        <div class="game-card">
                <img src="Images/cover5.jpg" alt="Game Cover">
            </div>
        </div>
    </section>
    <div class="footer">
        <div class="footer-top"> 
            <div class="footer-left">
                <h2>Frolik</h2>
                <p>Discover Your Next Favorite Game</p>
            </div>
            <ul class="footer-right">
                <li><a href="#">Home</a></li>
                <li><a href="#">Games</a></li>
                <li><a href="#">Categories</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Support</a></li>
            </ul>
        </div>
        <hr>
        <div class="footer-bottom">
            <p>© 2026 Frolik. All rights reserved.</p>
            <ul>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
            </ul>
        </div>
    </div>

</body>

</html>
